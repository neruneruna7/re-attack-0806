# prepross_reattack.toml

[tasks.prepross-mnist-fgsm-gauss-fgsm]
description = "MNIST: FGSM attack -> Gaussian Blur -> FGSM re-attack"
command = "uv"
args = [
    "run", "src/general_preprocess_reattack.py",
    "--dataset", "mnist",
    "--model", "morimoto-mnist",
    "--attack-kind", "fgsm",
    "--attack-eps", "0.25",
    "--preprocess-kind", "gaussian_blur",
    "--preprocess-kernel-size", "3",
    "--preprocess-sigma", "1.0",
    "--reattack-kind", "fgsm",
    "--reattack-eps", "0.25",
    "--batch-size", "128",
    "--num-samples", "-1",
    "--no-save-images"
]

