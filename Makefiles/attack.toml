[tasks.attack-bim-advo]
    description="Attack InceptionV3 model on ImageNet with BIM"
    category="Attacks"
    command="uv"
    args=[
        "run",
        "src/general_ae.py",
        "bim",
        "--dataset",
        "imagenet",
        "--model",
        "inception-v3",
        "--epsilon",
        "8/255",
        "--alpha",
        "1/255",
        "--n",
        "10",
        "--batch-size",
        "16",
        "--num-samples",
        "1024",
        "--shuffle-dataloader",
    ]
    # バッチサイズが64だとメモリ不足になる

