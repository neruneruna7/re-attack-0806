
[tasks.attack-morimoto-mnist-bim]
    description="Attack Morimoto MNIST model with BIM"
    category="Attacks"
    command="uv"
    args=[
        "run",
        "src/general_ae.py",
        "bim",
        "--dataset",
        "mnist",
        "--model",
        "morimoto-mnist",
        "--epsilon",
        "0.3",
        "--alpha",
        "0.05",
        "--n",
        "10",
        "--batch-size",
        "128",
    ]

